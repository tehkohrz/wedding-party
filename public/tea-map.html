<head>
<meta charset="utf-8" />
<title>Tea Ceremony — Walking Map</title>
<!--
  The walk from The Outpost Hotel's car park to Oasia Resort Sentosa, sent
  with the tea ceremony invite. Roads and buildings are OpenStreetMap data;
  the route follows Google's walking directions (about 340 m).
  Rendered to public/tea-map.png:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=560,1000 --screenshot=public/tea-map.png \
      file://$PWD/public/tea-map.html

  then trim the blank space under the card.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Great+Vibes&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 560px; background: #ffffff; font-variant-numeric: lining-nums; }
  .caps { font-family: 'Cormorant Garamond', serif; letter-spacing: 0.28em; text-transform: uppercase; }
  .script { font-family: 'Great Vibes', cursive; color: #d4537e; }
  .stripes { background: repeating-linear-gradient(90deg, #f6efe2 0px, #f6efe2 16px, #cbdcee 16px, #cbdcee 32px); padding: 32px; }
  .card { background: #FDFBF3; border: 3px solid #a9b566; border-radius: 42px 58px 46px 62px / 58px 44px 64px 48px; padding: 9px; }
  .inner { border: 1.5px solid #c3cd8b; border-radius: 36px 50px 40px 54px / 50px 38px 56px 42px; padding: 36px 8px 32px; text-align: center; }
  .map { display: block; margin: 20px auto 24px; width: 440px; border: 1.5px solid #c3cd8b; border-radius: 24px; overflow: hidden; }
  .map svg { display: block; }
  .steps { list-style: none; counter-reset: step; width: 410px; margin: 0 auto; text-align: left; font-family: 'Cormorant Garamond', serif; font-size: 17.5px; line-height: 1.4; color: #40513f; }
  .steps li { counter-increment: step; display: flex; gap: 12px; align-items: baseline; }
  .steps li + li { margin-top: 8px; }
  .steps li::before { content: counter(step); flex: 0 0 24px; height: 24px; border-radius: 50%; background: #d4537e; color: #fff; font-size: 14px; font-weight: 600; line-height: 24px; text-align: center; transform: translateY(-2px); }

  /* Map layers */
  .ground { fill: #f6efe2; }
  .park { fill: #e4e9c9; }
  .bldg { fill: #e7dec9; }
  .road-edge, .road, .lane-edge, .lane, .route-halo, .route { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .road-edge { stroke: #ddd1b9; stroke-width: 13; }
  .road { stroke: #fffdf7; stroke-width: 10; }
  .lane-edge { stroke: #ddd1b9; stroke-width: 8; }
  .lane { stroke: #fffdf7; stroke-width: 5.5; }
  .outpost { fill: #dfe5b8; stroke: #a9b566; stroke-width: 2; }
  .oasia { fill: #f8dbe4; stroke: #d4537e; stroke-width: 2; }
  .route-halo { stroke: #ffffff; stroke-width: 12; opacity: 0.85; }
  .route { stroke: #d4537e; stroke-width: 6.5; stroke-dasharray: 0 11; }
  .road-name { font-family: 'Cormorant Garamond', serif; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; fill: #8a9163; dominant-baseline: central; }
  .pin-park { fill: #6f7d3e; stroke: #fff; stroke-width: 3; }
  .pin-tea { fill: #d4537e; stroke: #fff; stroke-width: 3; }
  .pin-p { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 17px; fill: #fff; text-anchor: middle; dominant-baseline: central; }
  .pin-xi { font-size: 13px; fill: #fff; text-anchor: middle; dominant-baseline: central; }
  .label { text-anchor: middle; paint-order: stroke; stroke: #f6efe2; stroke-width: 4px; stroke-linejoin: round; }
  .label .name { font-family: 'Cormorant Garamond', serif; font-size: 13px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; fill: #40513f; }
  .label .note { font-family: 'Great Vibes', cursive; font-size: 22px; fill: #6f7d3e; }
  .label .tea { fill: #d4537e; }
  .badge { fill: #fffdf7; stroke: #d4537e; stroke-width: 1.5; }
  .badge-text { font-family: 'Cormorant Garamond', serif; font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; fill: #d4537e; text-anchor: middle; dominant-baseline: central; }
  .compass { fill: #6f7d3e; }
  .compass text { font-family: 'Cormorant Garamond', serif; font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  .credit { font-family: 'Cormorant Garamond', serif; font-size: 9px; fill: #8a9163; text-anchor: end; }
</style>
