<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Tea Ceremony — Invite</title>
<!--
  The sendable tea ceremony invitation (WhatsApp), sent with
  public/tea-map.png. Rendered to public/tea-invite.png:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=520,1000 --screenshot=public/tea-invite.png \
      file://$PWD/public/tea-invite.html

  then trim the blank space under the card. The frame and type copy
  public/e-invite.html, with a teapot in place of the sun.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 520px; background: #ffffff; }
  .caps { font-family: 'Cormorant Garamond', serif; letter-spacing: 0.28em; text-transform: uppercase; }
  .script { font-family: 'Great Vibes', cursive; color: #d4537e; }
</style>
</head>
<body>
  <div style="width: 520px; background: repeating-linear-gradient(90deg, #f6efe2 0px, #f6efe2 16px, #cbdcee 16px, #cbdcee 32px); padding: 32px;">
    <div style="background: #FDFBF3; border: 3px solid #a9b566; border-radius: 42px 58px 46px 62px / 58px 44px 64px 48px; padding: 9px;">
      <div style="border: 1.5px solid #c3cd8b; border-radius: 36px 50px 40px 54px / 50px 38px 56px 42px; padding: 40px 34px 0; text-align: center; overflow: hidden;">
        <svg width="88" height="83" viewBox="0 -6 70 66" aria-hidden="true" style="display:block;margin:0 auto 14px;">
          <g fill="none" stroke="#c3cd8b" stroke-width="1.6" stroke-linecap="round">
            <path d="M30 9 Q27 6 30 3 Q33 0 30 -3"/>
            <path d="M38 10 Q35 7 38 4 Q41 1 38 -2"/>
          </g>
          <path d="M53 27 Q63 27 61 36 Q59 44 50 43" fill="none" stroke="#e0b94f" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M19 33 C12 32 9 26 6 20 L10 18.5 C12.5 23 15.5 27 21 28 Z" fill="#f2d478" stroke="#e0b94f" stroke-width="1.4" stroke-linejoin="round"/>
          <ellipse cx="35" cy="35" rx="17" ry="14" fill="#f2d478" stroke="#e0b94f" stroke-width="1.6"/>
          <path d="M25 22.5 Q35 13 45 22.5 Z" fill="#f2d478" stroke="#e0b94f" stroke-width="1.4" stroke-linejoin="round"/>
          <circle cx="35" cy="15.5" r="2.4" fill="#e0b94f"/>
          <path d="M27 50 H43" stroke="#e0b94f" stroke-width="2" stroke-linecap="round"/>
          <text x="35" y="36.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#d4537e">囍</text>
        </svg>
        <p class="caps" style="font-size: 14px; color: #6f7d3e; line-height: 2; margin-bottom: 10px;">You are invited to the</p>
        <p class="script" style="font-size: 56px; line-height: 1.15;">Tea Ceremony</p>
        <p class="caps" style="font-size: 14px; color: #6f7d3e; margin: 16px 0 28px;">of Jermaine &amp; Dong Kun</p>
        <div style="display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 28px; white-space: nowrap;">
          <span class="caps" style="font-size: 14px; color: #40513f;">Saturday</span>
          <span style="border-left: 1px solid #a9b566; align-self: stretch;"></span>
          <span style="font-family: 'Cormorant Garamond', serif; color: #d4537e;">
            <span style="font-size: 40px; font-weight: 500; display:block; line-height:1;">31</span>
            <span class="caps" style="font-size: 14px; display:block; margin-top:3px;">Oct</span>
            <span class="caps" style="font-size: 14px; display:block;">2026</span>
          </span>
          <span style="border-left: 1px solid #a9b566; align-self: stretch;"></span>
          <span class="caps" style="font-size: 14px; color: #40513f; line-height: 1.7;">11:00 –<br/>11:30 am</span>
        </div>
        <svg width="132" height="28" viewBox="0 0 120 26" aria-hidden="true" style="display:block;margin:0 auto 16px;">
          <path d="M10 13 Q35 4 60 13 Q85 22 110 13" stroke="#a9b566" stroke-width="1.4" fill="none" stroke-linecap="round"/>
          <ellipse cx="34" cy="8" rx="4" ry="2.4" fill="#c3cd8b" transform="rotate(-18 34 8)"/>
          <ellipse cx="60" cy="13" rx="4" ry="2.4" fill="#c3cd8b"/>
          <ellipse cx="86" cy="18" rx="4" ry="2.4" fill="#c3cd8b" transform="rotate(18 86 18)"/>
        </svg>
        <p class="caps" style="font-size: 14px; color: #40513f; line-height: 2.1; margin-bottom: 24px;">Oasia Resort Sentosa<br/>23 Beach View, Sentosa Island</p>
        <p class="caps" style="font-size: 12.5px; color: #8a9163; line-height: 2;">Park at The Outpost Hotel<br/>and walk over, about 5 minutes</p>
        <img src="pigeons.png" alt="" width="190" style="display:block;margin:34px auto -2px;"/>
      </div>
    </div>
  </div>
</body>
</html>
